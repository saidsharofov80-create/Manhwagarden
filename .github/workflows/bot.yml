name: bot
on:
  workflow_dispatch:
  # Uch bosqichli rejim (2026-10-02, hybrid.py): telefon (asosiy) > noutbuk > shu yer. Og'ir
  # Cloudflare darvozasi (manhwa-gate) ENDI ISHLATILMAYDI - faqat @manhwatarjima_bot undan
  # foydalanadi. Har 15 daqiqada tekshiradi: telefon/noutbuk tirik bo'lsa darrov chiqadi (bir
  # necha soniya, deyarli ish vaqti sarflanmaydi); ikkalasi ham o'lik bo'lsagina ishga tushadi va
  # ulardan biri qaytguncha yoki 330 daqiqalik chegaragacha xabar oladi.
  schedule:
    - cron: "*/15 * * * *"
concurrency:
  group: bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutubxonalar (keshdan)
        id: cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-v2
      - name: O'rnatish
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          BOT_TOKEN=x OWNER_ID=1 .venv/bin/python -c "import fast_ocr; fast_ocr.warm_up()"
      - name: Shrift (Digital Strip, Blambot - repoga qo'yilmaydi, litsenziya)
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/ds.zip "https://dl.dafont.com/dl/?f=digital_strip"
          unzip -oj /tmp/ds.zip digistrip.ttf -d assets/fonts
      - name: Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          # Uch bosqichli tanlov (hybrid.py): manhwa-heartbeat juda yengil (D1'ga kuniga bir nechta
          # yozuv/tomon) - @manhwatarjima_bot ning og'ir manhwa-gate* darvozalariga tegmaydi.
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          HEARTBEAT_KEY: ${{ secrets.HEARTBEAT_KEY }}
          HEARTBEAT_ROLE: github
          HEARTBEAT_PREFIX: garden
          OCR_ENGINE: fast
          # Tozalash v2: orqa fon (gradient, soya, rasm) saqlanadi
          RENDER_V2: "1"
          # Tarjimani Gemini tahrirlaydi
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 2026-10-01: @Manhwatarjima1_bot darajasiga tenglashtirildi (foydalanuvchi: "shu botni
          # manhwatarjima1_bot darajasigacha yaxshilab ber"). FAQAT sifat va tezlik olindi - bu bot
          # YOPIQ qoladi, shuning uchun PUBLIC_BOT / FREE_CHAPTERS / PACKS / SHOP_UI / DAILY_LIMIT YO'Q.
          # Pufakcha shakliga qarab shrift (oval/to'rtburchak/tikanli/rasm ustida/tizim oynasi).
          # Tozalash v3 va sizish himoyasi ham shu bayroq ostida (image_editor).
          FONT_STYLES: "1"
          # Bob bir yo'la tarjima: Gemini'ga sahifa boshiga emas, 40 qatorlik bo'laklarda
          # (13 sahifali bob: 13 so'rov -> 1-2). Lite modellar ham "low" fikrlash bilan (sifat uchun).
          CHAPTER_BATCH: "1"
          GEMINI_CHUNK: "40"
          GEMINI_MODELS: "gemini-3.5-flash:low,gemini-3.8-flash:low,gemini-3.7-flash:low,gemini-3.6-flash:low,gemini-3-flash-preview:low,gemini-3.5-flash-lite:low,gemini-3.1-flash-lite:low,gemini-3.1-flash-lite-preview:low,gemma-4-31b-it"
          # Navbatsiz: bir vaqtda 3 ta ish, bo'sh foydalanuvchi oldinga (bot.py _pick_job)
          PARALLEL_JOBS: "3"
          # 20 MB dan katta fayllar (bigfile.py, MTProto)
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_SLOT: "1"
        run: .venv/bin/python bot.py
