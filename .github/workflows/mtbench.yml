name: tarjima-sinovi
# HF tarjima modellarini haqiqiy manhwa gaplarida solishtirish (bir martalik sinov).
# Natija: har model uchun artifact (mt_<model>.json).
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Nechta gap"
        default: "40"
jobs:
  seq2seq:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model:
          - facebook/nllb-200-distilled-600M
          - facebook/nllb-200-distilled-1.3B
          - facebook/nllb-200-3.3B
          - facebook/m2m100_1.2B
          - google/madlad400-3b-mt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q transformers sentencepiece protobuf
      - working-directory: bench
        run: python mtbench.py ${{ matrix.model }} ${{ inputs.n }}
      - uses: actions/upload-artifact@v4
        with:
          name: mt-${{ strategy.job-index }}
          path: bench/mt_*.json
  llm:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model:
          - hf.co/QuantFactory/Llama-3.1-8B-Instuct-Uz-GGUF:Q4_K_M
          - gemma3:12b
          - qwen3:8b
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://ollama.com/install.sh | sh
      - run: |
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull ${{ matrix.model }}
      - working-directory: bench
        run: python3 llmbench.py "${{ matrix.model }}" ${{ inputs.n }}
      - uses: actions/upload-artifact@v4
        with:
          name: llm-${{ strategy.job-index }}
          path: bench/mt_*.json
